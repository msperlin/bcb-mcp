[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bcb-mcp"
version = "0.1.0"
description = "MCP server for Brazilian Central Bank (BCB-SGS) time series, with a curated series dictionary and a parquet/DuckDB cache"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Marcelo Perlin", email = "marceloperlin@gmail.com" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "bcb",
    "banco-central",
    "brazil",
    "sgs",
    "economics",
    "macro",
    "time-series",
    "duckdb",
    "parquet",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=3.4",
    "httpx>=0.27",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.9",
]

[project.urls]
Homepage = "https://github.com/msperlin/bcb-mcp"
Repository = "https://github.com/msperlin/bcb-mcp"
Issues = "https://github.com/msperlin/bcb-mcp/issues"
Changelog = "https://github.com/msperlin/bcb-mcp/blob/main/CHANGELOG.md"
"R package" = "https://github.com/msperlin/GetBCBData"

[project.scripts]
bcb-mcp = "bcb_mcp.server:cli_main"

[tool.hatch.build.targets.wheel]
packages = ["src/bcb_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/bcb_mcp",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--tb=short"]
