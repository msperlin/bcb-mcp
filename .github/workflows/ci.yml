name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create the virtual environment
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install the package
        run: uv pip install -e ".[dev]"

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

      - name: Validate the dictionary
        run: |
          uv run python -c "
          import json
          d = json.load(open('src/bcb_mcp/data/series_dictionary.json'))
          assert len(d['series']) > 100
          assert all(s['category'] in d['categories'] for s in d['series'])
          print('dictionary ok:', len(d['series']), 'series')
          "

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist and wheel
        run: uv build

      - name: Check the wheel ships the dictionary
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(n.endswith("series_dictionary.json") for n in names), names
          assert any(n.endswith("bcb_mcp/py.typed") for n in names), names
          print(wheel, "contains the dictionary and py.typed")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
